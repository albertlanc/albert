name: Build Smart VPN with Native Engines

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          check-latest: true

      - name: Setup Android NDK
        run: echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/25.2.9519653" >> $GITHUB_ENV

      - name: Install Android NDK
        run: sdkmanager --install "ndk;25.2.9519653"

      - name: Build libXray (Go)
        run: |
          echo "Cloning and building libXray..."
          git clone https://github.com/XTLS/libXray.git
          cd libXray
          go install golang.org/x/mobile/cmd/gomobile@latest
          export PATH=$PATH:$(go env GOPATH)/bin
          gomobile init
          gomobile bind -v -androidapi 26 -target=android/arm,android/arm64,android/amd64,android/386 .
          mkdir -p ../app/libs
          mv libXray.aar ../app/libs/
          cd ..

      - name: Build hev-socks5-tunnel (C/NDK)
        run: |
          echo "Cloning and building hev-socks5-tunnel..."
          mkdir build-tun
          cd build-tun
          git clone --recursive https://github.com/heiher/hev-socks5-tunnel jni
          $ANDROID_NDK_HOME/ndk-build
          mkdir -p ../app/src/main/jniLibs
          cp -r libs/* ../app/src/main/jniLibs/
          cd ..

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SmartVPN-Debug
          path: app/build/outputs/apk/debug/*.apk
