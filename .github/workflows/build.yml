name: Build Smart v3.5 APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          check-latest: true

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r25c
          link-to-sdk: true

      - name: Apply NDK Path
        run: echo "ANDROID_NDK_HOME=${{ steps.setup-ndk.outputs.ndk-path }}" >> $GITHUB_ENV

      - name: Build libXray (Go - Slim ARM64 & ARMv7 Only)
        run: |
          git clone https://github.com/XTLS/libXray.git
          cd libXray
          go mod download
          go get golang.org/x/mobile/bind
          go install golang.org/x/mobile/cmd/gomobile@latest
          export PATH=$PATH:$(go env GOPATH)/bin
          gomobile init
          gomobile bind -v -androidapi 26 -ldflags="-s -w -checklinkname=0" -target=android/arm64,android/arm .
          mkdir -p ../app/libs
          mv libXray.aar ../app/libs/
          cd ..

      - name: Build hev-socks5-tunnel (C/NDK)
        run: |
          mkdir build-tun
          cd build-tun
          git clone --recursive https://github.com/heiher/hev-socks5-tunnel jni
          $ANDROID_NDK_HOME/ndk-build APP_ABI="arm64-v8a armeabi-v7a"
          mkdir -p ../app/src/main/jniLibs
          cp -r libs/* ../app/src/main/jniLibs/
          cd ..

      - name: Build SlowDNS / dnstt-client (Android NDK PIE)
        run: |
          git clone https://github.com/Mygod/dnstt.git || git clone https://www.bamsoftware.com/git/dnstt.git
          cd dnstt/dnstt-client
          mkdir -p ../../app/src/main/jniLibs/arm64-v8a
          mkdir -p ../../app/src/main/jniLibs/armeabi-v7a
          CGO_ENABLED=1 GOOS=android GOARCH=arm64 CC=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang go build -buildmode=pie -trimpath -ldflags="-s -w -checklinkname=0" -o ../../app/src/main/jniLibs/arm64-v8a/libdnstt.so .
          CGO_ENABLED=1 GOOS=android GOARCH=arm GOARM=7 CC=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/armv7a-linux-androideabi26-clang go build -buildmode=pie -trimpath -ldflags="-s -w -checklinkname=0" -o ../../app/src/main/jniLibs/armeabi-v7a/libdnstt.so .
          cd ../..

      - name: Build Hysteria2 Client (Android NDK PIE)
        run: |
          git clone --depth 1 https://github.com/apernet/hysteria.git
          cd hysteria/app
          go mod download
          mkdir -p ../../app/src/main/jniLibs/arm64-v8a
          mkdir -p ../../app/src/main/jniLibs/armeabi-v7a
          CGO_ENABLED=1 GOOS=android GOARCH=arm64 CC=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang go build -buildmode=pie -trimpath -ldflags="-s -w -checklinkname=0" -o ../../app/src/main/jniLibs/arm64-v8a/libhysteria2.so .
          CGO_ENABLED=1 GOOS=android GOARCH=arm GOARM=7 CC=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/armv7a-linux-androideabi26-clang go build -buildmode=pie -trimpath -ldflags="-s -w -checklinkname=0" -o ../../app/src/main/jniLibs/armeabi-v7a/libhysteria2.so .
          cd ../..

      - name: Strip Native Binaries
        run: |
          STRIP_TOOL="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip"
          find app/src/main/jniLibs -name "*.so" -exec $STRIP_TOOL --strip-unneeded {} + || true

      - name: Setup Gradle 8.6
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.6'

      - name: Build Debug APK
        run: |
          gradle assembleDebug --stacktrace
          mv app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/SmartVPN-v3.5.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SmartVPN-v3.5
          path: app/build/outputs/apk/debug/SmartVPN-v3.5.apk
